# OpenTelemetry Demo - AWS CloudWatch Configuration
# Sends telemetry exclusively to AWS CloudWatch (built-in tools disabled)

prometheus:
  enabled: false
grafana:
  enabled: false
opensearch:
  enabled: false
jaeger:
  enabled: false

components:
  frontend-proxy:
    service:
      type: LoadBalancer

opentelemetry-collector:
  # Service account created by eksctl with IRSA
  serviceAccount:
    create: false
    name: "opentelemetry-demo-otelcol"

  command:
    extraArgs: []

  alternateConfig:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            cors:
              allowed_origins:
              - "http://*"
              - "https://*"
            endpoint: 0.0.0.0:4318

    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 65
        spike_limit_percentage: 20

      batch:
        send_batch_max_size: 200
        send_batch_size: 200
        timeout: 5s

      resourcedetection:
        detectors: [env, eks, ec2]
        timeout: 10s
        override: false

      resource:
        attributes:
        - action: insert
          from_attribute: k8s.pod.uid
          key: service.instance.id
        - action: insert
          key: deployment.environment
          value: "demo"

      # Filter high-frequency metrics
      filter/too_frequent:
        metrics:
          metric:
          - '(IsMatch(name, "(.*)app_currency(.*)")) or (resource.attributes["service.name"] == "flagd")'

      # Handle AWS attribute name collisions
      transform/collision:
        metric_statements:
        - context: datapoint
          statements:
          - set(attributes["exported_location"], attributes["location"]) where attributes["location"] != nil
          - delete_key(attributes, "location") where attributes["location"] != nil
          - set(attributes["exported_cluster"], attributes["cluster"]) where attributes["cluster"] != nil
          - delete_key(attributes, "cluster") where attributes["cluster"] != nil
          - set(attributes["exported_namespace"], attributes["namespace"]) where attributes["namespace"] != nil
          - delete_key(attributes, "namespace") where attributes["namespace"] != nil
          - set(attributes["exported_job"], attributes["job"]) where attributes["job"] != nil
          - delete_key(attributes, "job") where attributes["job"] != nil
          - set(attributes["exported_instance"], attributes["instance"]) where attributes["instance"] != nil
          - delete_key(attributes, "instance") where attributes["instance"] != nil

    exporters:
      otlphttp/logs:
        compression: gzip
        logs_endpoint: https://logs.us-west-2.amazonaws.com/v1/logs
        headers: 
          x-aws-log-group: /aws/otel-demo/application
          x-aws-log-stream: default
        auth:
          authenticator: sigv4auth/logs
      
      otlphttp/traces:
        compression: gzip
        traces_endpoint: https://xray.us-west-2.amazonaws.com/v1/traces
        auth:
          authenticator: sigv4auth/traces

      awsemf:
        region: us-west-2
        log_group_name: /aws/otel-demo/metrics
        namespace: OtelDemo
        dimension_rollup_option: NoDimensionRollup
        resource_to_telemetry_conversion:
          enabled: true

    extensions:
      sigv4auth/logs:
        region: "us-west-2"
        service: "logs"
      
      sigv4auth/traces:
        region: "us-west-2"
        service: "xray"

      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check, sigv4auth/logs, sigv4auth/traces]
      telemetry:
        logs:
          encoding: json
        metrics:
          level: detailed
          readers:
          - periodic:
              exporter:
                otlp:
                  protocol: grpc
                  endpoint: localhost:4317
      pipelines:
        logs:
          receivers: [otlp]
          processors: [memory_limiter, resourcedetection, resource, batch]
          exporters: [otlphttp/logs]
        
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resourcedetection, resource, batch]
          exporters: [otlphttp/traces]
        
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, filter/too_frequent, transform/collision, resourcedetection, resource, batch]
          exporters: [awsemf]
